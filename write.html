<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>글쓰기</title>
</head>
<body>
     <!--공통 상단 메뉴-->
<header>
    <div class="logo">
        <a href="Index.html">CHOI PHARMA</a>
    </div>

<main>
    <section class="page-title">
        <h1>게시판</h1>
        <p>CHOI PHARMA의 새로운 소식을 확인하세요.</p>
    </section>
<!--공통 디자인 끝-->

    <section class="content-section form-section">
        <h2>글쓰기</h2>
        <form>
            <label>제목</label>
            <input type="text" id="title" placeholder="제목을 입력하세요">

            <label>작성자</label>
            <input type="text" id="writer" placeholder="작성자를 입력하세요">

            <label>내용</label>
            <textarea id="content" rows="10" placeholder="내용을 입력하세요"></textarea>
        </form>

        <div class="form-buttons">
            <button type="submit" class="button">등록하기</button>
            <a href="board.html" class="button button-gray">취소하기</a>
        </div>

    </section>
